                link=$(curl -sk -o /dev/null -w '%{http_code}' "https://$SITE_URL$DEEP_LINK_PATH")
                echo "HTTP /: $code  HTTP $DEEP_LINK_PATH: $link"
                if [ "$code" != "200" ] || [ "$link" != "200" ]; then
                  echo "##vso[task.logissue type=error]Verificación fallida: / = $code, $DEEP_LINK_PATH = $link"
                  exit 1
                fi
              else
